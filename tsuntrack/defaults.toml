[general]
enabled = true
theme = "tsundere"
language = "en"
max_frames = 5
context_lines = 1
error_line_style = "bold red"
line_number_style = "dim"
show_hints = true
asyncio_helper = true

[general.syntax]
theme = "monokai"

[general.syntax.styles]
"Comment.Special" = "bold #5C6370"
"Comment" = "#5C6370"
"String.Doc" = "italic #5C6370"
"String" = "#98C379"
"Number" = "#D19A66"
"Name.Function" = "#61AFEF"
"Name.Decorator" = "#61AFEF"
"Name.Class" = "#E5C07B"
"Name.Builtin" = "#E06C75"
"Name.Constant" = "#D19A66"
"Name.Attribute" = "#E06C75"
"Name.Tag" = "#E06C75"
"Name" = "#ABB2BF"
"Keyword.Namespace" = "#C678DD"
"Keyword.Type" = "#E5C07B"
"Keyword" = "bold #C678DD"
"Operator.Word" = "#C678DD"
"Operator" = "#56B6C2"
"Punctuation" = "#ABB2BF"
"Generic.Error" = "#E06C75"

[exceptions.default]
template = '{message}'

# import 名 ≠ pip 包名的映射（import PIL 但要 pip install pillow）
[hints.aliases]
PIL = "pillow"
cv2 = "opencv-python"
sklearn = "scikit-learn"
yaml = "pyyaml"
bs4 = "beautifulsoup4"
