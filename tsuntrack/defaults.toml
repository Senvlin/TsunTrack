[general]
enabled = true
theme = "neko"
show_locals = true
max_frames = 5
context_lines = 1
error_line_style = "bold red"
line_number_style = "dim"
show_hints = true

# 上下文代码高亮:
# - theme: pygments 内置主题名(如 monokai / default / emacs / friendly / tango),
# - styles: pygments token 名 → rich 样式. token 名如 Keyword / Name.Function / String.Doc.

[general.syntax]
theme = "monokai"

[general.syntax.styles] 
# 以One Dark Pro举例, 实际上theme已经内置了（
# 以下键值对的键值需要写Pygment自带的Token，自创的会默认不显示，
"Comment.Special" = "bold #5C6370"
"Comment" = "#5C6370"
"String.Doc" = "italic #5C6370"
"String" = "#98C379"
"Number" = "#D19A66"
"Name.Function" = "#61AFEF"
"Name.Decorator" = "#61AFEF"
"Name.Class" = "#E5C07B"
"Name.Builtin" = "#E06C75"
"Name.Constant" = "#D19A66"
"Name.Attribute" = "#E06C75"
"Name.Tag" = "#E06C75"
"Name" = "#ABB2BF"
"Keyword.Namespace" = "#C678DD"
"Keyword.Type" = "#E5C07B"
"Keyword" = "bold #C678DD"
"Operator.Word" = "#C678DD"
"Operator" = "#56B6C2"
"Punctuation" = "#ABB2BF"
"Generic.Error" = "#E06C75"

[exceptions.default]
template = '{message}'

[hints.ModuleNotFoundError]
template = '模块 [green]{name}[/green] 未安装, 试试: [green]pip install {pip_name}[/green]'

[hints.ImportError]
template = '导入失败: 试试 [green]pip install {pip_name}[/green]'

[hints.NameError]
template = '变量 [green]{name}[/green] 未定义, 你是不是想写 [green]{did_you_mean}[/green]?'

[hints.AttributeError]
template = '对象没有 [green]{name}[/green] 属性, 你是不是想写 [green]{did_you_mean}[/green]?'

[hints.TimeoutError]
template = '{message}'

[hints.RuntimeError]
template = '{message}'

[hints.OSError]
template = '{message}'

[hints.SyntaxError]
template = '{message}'

[hints.TypeError]
template = '{message}'

[hints.ValueError]
template = '{message}'

[hints.AssertionError]
template = '{message}'

# import 名 ≠ pip 包名的映射（import PIL 但要 pip install pillow）
[hints.aliases]
PIL = "pillow"
cv2 = "opencv-python"
sklearn = "scikit-learn"
yaml = "pyyaml"
bs4 = "beautifulsoup4"

[theme."tsuntere".exceptions.NameError]
